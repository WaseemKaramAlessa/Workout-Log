<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="theme-color" content="#16a34a">
<title>Lift Log</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#15191c;--mute:#6b7378;--line:#e1e4e0;--acc:#16a34a;--accink:#fff;--inp:#f0f2ef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1213;--card:#181c1e;--ink:#eef1ef;--mute:#8d979c;--line:#2a3033;--acc:#22c55e;--accink:#06260f;--inp:#22282b}}
:root[data-theme="dark"]{--bg:#0f1213;--card:#181c1e;--ink:#eef1ef;--mute:#8d979c;--line:#2a3033;--acc:#22c55e;--accink:#06260f;--inp:#22282b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0;padding:12px 16px 4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:15px}
.tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.tab.add{background:transparent;border-style:dashed;color:var(--acc);font-weight:700;font-size:18px;padding:4px 16px}
main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.gap{height:10px}
.top{display:flex;gap:8px;align-items:center}
input{font:inherit;color:var(--ink);background:var(--inp);border:1px solid transparent;border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus{outline:2px solid var(--acc);background:var(--card)}
.name{font-weight:600;background:transparent;padding:6px 4px}
.x{flex:none;border:0;background:none;color:var(--mute);font-size:22px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;margin-top:10px}
.grid>div{grid-column:span 2}.grid>.done{grid-column:span 3}
.grid label{white-space:nowrap;font-size:11px;color:var(--mute);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.grid .done label{color:var(--acc)}
.grid input{text-align:center;padding:9px 4px}
.link{display:flex;gap:8px;margin-top:8px}
.go{flex:none;display:none;align-items:center;background:var(--acc);color:var(--accink);text-decoration:none;font-weight:600;font-size:14px;padding:0 14px;border-radius:9px}
.go.show{display:flex}
.btn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--acc);font:inherit;font-weight:600;padding:12px;border-radius:12px}
.del{display:block;margin:22px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline}
.sure{color:#dc2626!important;font-weight:700;font-size:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 8px}.mo{font-weight:700;margin-right:auto}.bar input{width:auto;padding:6px 8px;font-size:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:7px 11px;border-radius:99px}.chip.t{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.srow:first-of-type{border:0}
select{font:inherit;color:var(--ink);background:var(--inp);border:0;border-radius:9px;padding:8px}
.tab small{display:block;font-size:11px;font-weight:400;opacity:.8}.tab.today{box-shadow:inset 0 0 0 2px var(--acc)}
main{padding-bottom:170px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button span{font-size:20px}.nav .on{color:var(--acc);font-weight:700}
.srow.now{background:var(--inp);border-radius:10px;padding-left:8px;padding-right:8px}.srow select{margin-left:auto;margin-right:8px}.mute{color:var(--mute);font-size:12px}.big{font-size:22px;font-weight:700;margin:2px 0 12px}
.timer{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--card);border:1px solid var(--acc);border-radius:14px;padding:10px 12px;z-index:7;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.trow{display:flex;align-items:center;gap:8px}.trow>div{margin-right:auto}.trow small{display:block;color:var(--mute);font-size:12px}.trow b{font-size:26px;font-variant-numeric:tabular-nums}
.tbar{height:4px;background:var(--inp);border-radius:4px;margin-bottom:8px;overflow:hidden}.tfill{height:100%;background:var(--acc);width:0}
.rest{display:flex;gap:8px;align-items:center;margin-top:8px}.rest input{width:72px;text-align:center}
.fin{margin-bottom:10px;border-style:solid;border-color:var(--acc)}.fin.on{background:var(--acc);color:var(--accink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal.wk span{text-align:center;font-size:11px;color:var(--mute)}
.cd{aspect-ratio:1;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}.cd small{font-size:9px;line-height:1}
.cd.w{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}.cd.td{box-shadow:0 0 0 2px var(--ink)}
</style>
</head>
<body>
<header><h1 id="ttl">🏋️ Lift Log</h1><div class="tabs" id="weeks"></div><div class="bar" id="bar"></div><div class="tabs" id="days"></div></header>
<main id="list"></main>
<div class="timer" id="timer" hidden><div class="tbar"><div class="tfill" id="tfill"></div></div><div class="trow"><div><small id="tname"></small><b id="tleft"></b></div><button class="chip" data-act="tm" data-v="-15">−15</button><button class="chip" data-act="tm" data-v="15">+15</button><button class="chip" data-act="tm" data-v="0">Skip</button></div></div>
<nav class="nav" id="nav"></nav>
<script>
var DAYS=[["push_a","Push A"],["push_b","Push B"],["pull_a","Pull A"],["pull_b","Pull B"],["leg_a","Leg A"],["leg_b","Leg B"]];
var Y="https://www.youtube.com/watch?v=";
// name, reps, sets, link, real sets, gap-before
var SEED={
push_a:[["bench press","5 to 8",2,"",2],["backoff bench press","8 to 12",1,"",1],["incline bench press","8 to 12",3,"",2],["flies machen","12 to 20",3,"",3],["Dumbbell Seated Overhead Press","12 to 20",3,"https://musclewiki.com/exercise/dumbbell-seated-overhead-press?model=m",3,1],["Lateral raise","12 to 20",3,"",3],["cable pushdown","12 to 20",3,"",3,1],["skullcruchers","12 to 20",3,"",2]],
push_b:[["Dumbbell Seated Overhead Press","5 to 8",2],["backoff Dumbbell Seated Overhead Press","8 to 12",1],["Lateral raise","12 to 20",3],["bench press","12 to 15",3,"","",1],["incline bench press","12 to 15",3],["flies machen","12 to 20",3],["cable pushdown","12 to 20",3,"","",1],["skullcruchers","12 to 20",3]],
pull_a:[["pull up","8 to 12",3],["straight arm pull downs","12 to 20",3],["meadows row","12 to 15",3,Y+"G-jU1aPVhnY"],["shrugs","12 to 15",3],["strict curl","8 to 10",3,"","",1],["hammer curl","8 to 12",3],["preacher curl","12 to 20",3]],
pull_b:[["barbell rows","8 to 12",3],["seated cable row","12 to 20",3,Y+"5Z27soGfOns"],["lat pulldown","12 to 15",3,Y+"SALxEARiMkw"],["shrugs","12 to 15",3],["strict curl","8 to 10",3,"","",1],["hammer curl","12 to 20",3],["conecntration curl","8 to 12",3,Y+"VMbDQ8PZazY"],["preacher curl","12 to 20",3]],
leg_a:[["calfraise","8 to 12",3],["squat","5 to 8",2,"","",1],["back off set of squat","8 to 12",1],["lunges","12 to 20",3],["leg extensions","12 to 20",3],["roman deadlift","8 to 12",3,Y+"PIt6QP_Dcf8&t=3s","",1]],
leg_b:[["calfraise","15 to 20",3],["hip thrust","8 to 12",3,"https://youtu.be/lAnqN0J_p5A","",1],["glute kickbacks","12 to 20",3,Y+"UbOcViik3hk"],["goodmornings","8 to 12",3,"https://youtu.be/8sGgyquE1Bs"],["hamstring curls","15 to 20",3,Y+"qYuwgGnPBZw"],["legpress","12 to 20",3,Y+"nDh_BlnLCGc","",1]]};
var KEY="liftlog.v1",S,uid=0,pend="";
var T=null,AC=null;
function fmtT(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.25;o.start();o.stop(AC.currentTime+.6)}catch(e){}}
function startRest(sec,name){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}T={end:Date.now()+sec*1000,total:sec,name:name,done:0};tick()}
function adjRest(v){if(!T)return;if(v===0){T=null}else{T.end+=v*1000;T.total=Math.max(1,T.total+v)}tick()}
function tick(){var el=document.getElementById("timer");if(!T){el.hidden=true;return}el.hidden=false;
 var left=Math.max(0,Math.ceil((T.end-Date.now())/1000));document.getElementById("tname").textContent=(T.name||"Rest")+" · rest";
 if(left<=0){if(!T.done){T.done=Date.now();beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  document.getElementById("tleft").textContent="Go! 💪";document.getElementById("tfill").style.width="100%";if(Date.now()-T.done>5000){T=null;el.hidden=true}return}
 T.done=0;document.getElementById("tleft").textContent=fmtT(left);document.getElementById("tfill").style.width=Math.min(100,(1-left/T.total)*100)+"%"}
setInterval(tick,250);
function calPage(){var now=new Date(),y=S.cy!==undefined?S.cy:now.getFullYear(),m=S.cm!==undefined?S.cm:now.getMonth();
 var first=new Date(y,m,1),off=(first.getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),cnt=0,cells="";
 for(var i=0;i<off;i++)cells+='<div></div>';
 for(var n=1;n<=dim;n++){var k=y+"-"+String(m+1).padStart(2,"0")+"-"+String(n).padStart(2,"0"),w=S.done[k];if(w)cnt++;
  cells+='<button class="cd'+(w?" w":"")+(k===iso(now)?" td":"")+'" data-cd="'+k+'">'+n+(w?'<small>'+(w==="x"?"✓":dname(w))+'</small>':'')+'</button>'}
 return '<div class="card"><div class="top"><button class="chip" data-cm="-1">‹</button><div class="big" style="flex:1;text-align:center;margin:0">'+first.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</div><button class="chip" data-cm="1">›</button></div><div class="cal wk">'+WD.map(function(x){return '<span>'+x+'</span>'}).join("")+'</div><div class="cal">'+cells+'</div></div><div class="card"><b>'+cnt+'</b> workout'+(cnt===1?"":"s")+' this month<div class="mute">Green days are days you finished a workout. Tap a day to mark or unmark it.</div></div>'}
var WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var DEF={Mon:"push_a",Tue:"pull_a",Wed:"leg_a",Thu:"push_b",Fri:"pull_b",Sat:"leg_b",Sun:""};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function mon(s){var d=s?new Date(s+"T12:00:00"):new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function fmt(d){return d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"})}
function dayDate(key){for(var j=0;j<7;j++)if(S.sched[WD[j]]===key){var d=mon(week().date);d.setDate(d.getDate()+j);return d}return null}
function dname(k){for(var i=0;i<DAYS.length;i++)if(DAYS[i][0]===k)return DAYS[i][1];return"Rest"}
function schedHTML(){return""}
function schedPage(){var m=mon(week().date),tk=WD[(new Date().getDay()+6)%7],now=iso(new Date());
 var h='<div class="card"><div class="big">'+m.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</div><div class="srow" style="border:0;padding-top:0"><span>Week '+(S.wk+1)+' starts</span><input type="date" id="wdate" value="'+week().date+'" style="width:auto"></div><div class="mute">Pick which workout you do on each day. It shows on the workout tabs with its date.</div></div><div class="card">';
 h+=WD.map(function(n,i){var d=new Date(m);d.setDate(d.getDate()+i);var k=S.sched[n];
  return '<div class="srow'+(iso(d)===now?" now":"")+'"><div><b>'+n+'</b> <span class="mute">'+d.toLocaleDateString(undefined,{day:"numeric",month:"short"})+'</span></div><select data-sd="'+n+'"><option value="">Rest</option>'+DAYS.map(function(x){return '<option value="'+x[0]+'"'+(k===x[0]?" selected":"")+'>'+x[1]+'</option>'}).join("")+'</select>'+(k?'<button class="chip" data-open="'+k+'">Open</button>':'<span style="width:58px"></span>')+'</div>'}).join("");
 return h+'</div>'}
function id(){return Date.now().toString(36)+(uid++)}
function ex(n,r,s,l,rs,g){return{id:id(),n:n,r:r,s:String(s),w:"",rr:"",rs:rs===undefined?"":String(rs),l:l||"",g:g?1:0}}
function seed(){var d={};DAYS.forEach(function(x){d[x[0]]=SEED[x[0]].map(function(a){return ex(a[0],a[1],a[2],a[3],a[4],a[5])})});return{weeks:[{id:id(),days:d}],wk:0,day:"push_a"}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!S.weeks||!S.weeks.length)S=seed();
 S.sched=S.sched||JSON.parse(JSON.stringify(DEF));S.done=S.done||{};S.weeks.forEach(function(w,i){if(!w.date){var d=mon();d.setDate(d.getDate()+7*i);w.date=iso(d)}})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function week(){return S.weeks[S.wk]}
function render(){
 var vw=S.view||"workout",sv=vw!=="workout";
 ["weeks","bar","days"].forEach(function(i){document.getElementById(i).style.display=sv?"none":""});
 document.getElementById("ttl").textContent=vw==="sched"?"📅 Schedule":vw==="cal"?"🗓️ Calendar":"🏋️ Lift Log";
 document.getElementById("nav").innerHTML='<button class="'+(vw==="workout"?"on":"")+'" data-view="workout"><span>🏋️</span>Workouts</button><button class="'+(vw==="sched"?"on":"")+'" data-view="sched"><span>📅</span>Schedule</button><button class="'+(vw==="cal"?"on":"")+'" data-view="cal"><span>🗓️</span>Calendar</button>';
 if(sv){document.getElementById("list").innerHTML=vw==="cal"?calPage():schedPage();return}
 var w="";S.weeks.forEach(function(_,i){w+='<button class="tab'+(i===S.wk?" on":"")+'" data-wk="'+i+'">Week '+(i+1)+'</button>'});
 w+='<button class="tab add" data-act="addweek" aria-label="Add new week">+</button>';
 document.getElementById("weeks").innerHTML=w;
 var m=mon(week().date),tk=S.sched[WD[(new Date().getDay()+6)%7]];
 document.getElementById("bar").innerHTML='<span class="mo">'+m.toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</span><input type="date" id="wdate" value="'+week().date+'" aria-label="Week date">'+(tk?'<button class="chip t" data-act="today">Today: '+dname(tk)+'</button>':'<span class="chip">Today: Rest day</span>');
 document.getElementById("days").innerHTML=DAYS.map(function(d){var dd=dayDate(d[0]);return '<button class="tab'+(d[0]===S.day?" on":"")+(dd&&iso(dd)===iso(new Date())?" today":"")+'" data-day="'+d[0]+'">'+d[1]+(dd?'<small>'+fmt(dd)+'</small>':'')+'</button>'}).join("");
 var h="";
 h+=schedHTML();
 week().days[S.day].forEach(function(e){
  if(e.g)h+='<div class="gap"></div>';
  var f=function(k,lab,m,cls){return '<div class="'+(cls||"")+'"><label>'+lab+'</label><input data-id="'+e.id+'" data-f="'+k+'" value="'+esc(e[k])+'" inputmode="'+(m||"text")+'" autocomplete="off"></div>'};
  h+='<div class="card"><div class="top"><input class="name" data-id="'+e.id+'" data-f="n" value="'+esc(e.n)+'" aria-label="Workout name"><button class="x'+(pend===e.id?" sure":"")+'" data-act="rm" data-id="'+e.id+'" aria-label="Delete">'+(pend===e.id?"Tap again to delete":"×")+'</button></div>'+
  '<div class="grid">'+f("r","Reps")+f("s","Sets","numeric")+f("w","Weight","decimal")+f("rr","Real reps","numeric","done")+f("rs","Real sets","numeric","done")+'</div>'+
  '<div class="link"><input data-id="'+e.id+'" data-f="l" value="'+esc(e.l)+'" type="url" placeholder="Add video link" autocomplete="off"><a class="go'+(e.l?" show":"")+'" href="'+esc(e.l)+'" target="_blank" rel="noopener">▶ Watch</a></div><div class="rest"><button class="chip t" data-act="rest" data-id="'+e.id+'">⏱ Start rest</button><input data-id="'+e.id+'" data-f="t" value="'+esc(e.t||"")+'" inputmode="numeric" placeholder="90" aria-label="Rest seconds"><span class="mute">sec</span></div></div>';
 });
 var dn=S.done[iso(new Date())];
 h+='<button class="btn fin'+(dn?" on":"")+'" data-act="finish">'+(dn?"✓ Workout done today — tap to undo":"✓ Finish workout")+'</button>';
 h+='<button class="btn" data-act="addex">+ Add exercise</button>';
 if(S.weeks.length>1)h+='<button class="del'+(pend==="wk"?" sure":"")+'" data-act="delweek">'+(pend==="wk"?"Tap again to delete Week "+(S.wk+1):"Delete Week "+(S.wk+1))+'</button>';
 document.getElementById("list").innerHTML=h;
}
function find(i){var a=week().days[S.day];for(var k=0;k<a.length;k++)if(a[k].id===i)return a[k]}
document.addEventListener("change",function(ev){
 var t=ev.target;if(t.id==="wdate"){if(t.value){week().date=t.value;save();render()}return}
 if(t.dataset&&t.dataset.sd!==undefined){S.sched[t.dataset.sd]=t.value;save();render();return}
 if(!t.dataset||!t.dataset.f)return;var e=find(t.dataset.id);if(!e)return;
 var v=t.value.trim();if(t.dataset.f==="l"&&v&&!/^https?:\/\//i.test(v)){v="https://"+v;t.value=v}
 e[t.dataset.f]=v;
 if(t.dataset.f==="l"){var a=t.parentNode.querySelector(".go");a.href=v;a.classList.toggle("show",!!v)}
 save();
});
document.addEventListener("click",function(ev){
 var b=ev.target.closest("[data-wk],[data-day],[data-act],[data-view],[data-open],[data-cd],[data-cm]");if(!b)return;var d=b.dataset;var was=pend;pend="";
 if(d.view){S.view=d.view}
 else if(d.open){S.view="workout";S.day=d.open}
 else if(d.cd){if(S.done[d.cd])delete S.done[d.cd];else{var dt=new Date(d.cd+"T12:00:00");S.done[d.cd]=S.sched[WD[(dt.getDay()+6)%7]]||"x"}}
 else if(d.cm){var cy=S.cy!==undefined?S.cy:new Date().getFullYear(),cm=(S.cm!==undefined?S.cm:new Date().getMonth())+ +d.cm,cn=new Date(cy,cm,1);S.cy=cn.getFullYear();S.cm=cn.getMonth()}
 else if(d.wk!==undefined){S.wk=+d.wk}
 else if(d.day){S.day=d.day}
 else if(d.act==="addweek"){
  var src=week(),nd={};
  DAYS.forEach(function(x){nd[x[0]]=src.days[x[0]].map(function(e){var c=JSON.parse(JSON.stringify(e));c.id=id();c.rr="";c.rs="";return c})});
  var nm=mon(src.date);nm.setDate(nm.getDate()+7);S.weeks.push({id:id(),date:iso(nm),days:nd});S.wk=S.weeks.length-1;
 }
 else if(d.act==="sched"){S.showSched=!S.showSched}
 else if(d.act==="today"){var tm=iso(mon());S.weeks.forEach(function(w,i){if(iso(mon(w.date))===tm)S.wk=i});S.day=S.sched[WD[(new Date().getDay()+6)%7]]||S.day}
 else if(d.act==="rest"){var re=find(d.id);startRest(parseInt(re&&re.t)||90,re?re.n:"");return}
 else if(d.act==="tm"){adjRest(+d.v);return}
 else if(d.act==="finish"){var td=iso(new Date());if(S.done[td])delete S.done[td];else S.done[td]=S.day}
 else if(d.act==="addex"){week().days[S.day].push(ex("New exercise","8 to 12",3))}
 else if(d.act==="rm"){if(was!==d.id){pend=d.id;render();return}var a=week().days[S.day];week().days[S.day]=a.filter(function(e){return e.id!==d.id})}
