<html lang="en">

<style>
:root{--bg:#f6f7f5;--card:#fff;--ink:#15191c;--mute:#6b7378;--line:#e1e4e0;--acc:#16a34a;--accink:#fff;--inp:#f0f2ef;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1213;--card:#181c1e;--ink:#eef1ef;--mute:#8d979c;--line:#2a3033;--acc:#22c55e;--accink:#06260f;--inp:#22282b}}
:root[data-theme="dark"]{--bg:#0f1213;--card:#181c1e;--ink:#eef1ef;--mute:#8d979c;--line:#2a3033;--acc:#22c55e;--accink:#06260f;--inp:#22282b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:20px;margin:0;padding:12px 16px 4px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:99px;font:inherit;font-size:15px}
.tab.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.tab.add{background:transparent;border-style:dashed;color:var(--acc);font-weight:700;font-size:18px;padding:4px 16px}
main{padding:12px 16px 40px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.gap{height:10px}
.top{display:flex;gap:8px;align-items:center}
input{font:inherit;color:var(--ink);background:var(--inp);border:1px solid transparent;border-radius:9px;padding:9px 10px;width:100%;min-width:0}
input:focus{outline:2px solid var(--acc);background:var(--card)}
.name{font-weight:600;background:transparent;padding:6px 4px}
.x{flex:none;border:0;background:none;color:var(--mute);font-size:22px;padding:2px 8px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 8px;margin-top:10px}
.grid>div{grid-column:span 2}.grid>.done{grid-column:span 3}
.grid label{white-space:nowrap;font-size:11px;color:var(--mute);display:block;margin-bottom:3px;text-transform:uppercase;letter-spacing:.03em}
.grid .done label{color:var(--acc)}
.grid input{text-align:center;padding:9px 4px}
.link{display:flex;gap:8px;margin-top:8px}
.go{flex:none;display:none;align-items:center;background:var(--acc);color:var(--accink);text-decoration:none;font-weight:600;font-size:14px;padding:0 14px;border-radius:9px}
.go.show{display:flex}
.btn{width:100%;border:1px dashed var(--line);background:transparent;color:var(--acc);font:inherit;font-weight:600;padding:12px;border-radius:12px}
.del{display:block;margin:22px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline}
.sure{color:#dc2626!important;font-weight:700;font-size:14px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 16px 8px}.mo{font-weight:700;margin-right:auto}.bar input{width:auto;padding:6px 8px;font-size:14px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:7px 11px;border-radius:99px}.chip.t{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.srow:first-of-type{border:0}
select{font:inherit;color:var(--ink);background:var(--inp);border:0;border-radius:9px;padding:8px}
.tab small{display:block;font-size:11px;font-weight:400;opacity:.8}.tab.today{box-shadow:inset 0 0 0 2px var(--acc)}
main{padding-bottom:210px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:6}
.nav button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px}.nav button span{font-size:20px}.nav .on{color:var(--acc);font-weight:700}
.srow.now{background:var(--inp);border-radius:10px;padding-left:8px;padding-right:8px}.srow select{margin-left:auto;margin-right:8px}.mute{color:var(--mute);font-size:12px}.big{font-size:22px;font-weight:700;margin:2px 0 12px}
.tfull{position:fixed;inset:0;background:var(--bg);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}.tfull[hidden]{display:none}
.tdial{position:relative;width:min(80vw,340px);aspect-ratio:1;border-radius:50%;background:#202224;box-shadow:0 0 0 10px #2a2c2e;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tdial svg{position:absolute;inset:0;width:100%;height:100%}.tick{stroke:#3a3d40;stroke-width:2;stroke-linecap:round}.tick.on{stroke:var(--acc)}
.tl{position:relative;color:#9aa0a6;font-size:19px;max-width:70%;text-align:center}.tt{position:relative;font-size:clamp(32px,10.5vw,48px);font-weight:600;color:#f1f3f4;font-variant-numeric:tabular-nums;margin-top:6px}.tt i{font-style:normal;color:var(--acc)}
.tadj{display:flex;gap:10px}.tc{display:flex;gap:44px;align-items:center}
.cb{width:84px;height:84px;border-radius:50%;border:0;font-size:28px;color:#fff;background:#2a2c2e;display:flex;align-items:center;justify-content:center}.cb.p{background:var(--acc)}.tmin{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:16px}
.pill{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:#202224;color:#fff;border-radius:99px;padding:8px 10px 8px 18px;z-index:7;display:flex;align-items:center;gap:10px;box-shadow:0 6px 20px rgba(0,0,0,.3);border:1px solid var(--acc)}.pill[hidden]{display:none}
.pill b{font-size:20px;font-variant-numeric:tabular-nums;color:var(--acc)}.pill span{flex:1;min-width:0;font-size:13px;color:#9aa0a6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill .chip{background:#2a2c2e;color:#fff;border-color:#2a2c2e}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mg .mh{grid-column:1/-1;font-weight:700;margin-top:6px}.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
.mc img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.mc input{border-radius:0;font-size:13px;padding:8px}.mc .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;font-size:13px;padding:4px 10px}
.addp{display:block;text-align:center;margin-bottom:12px;cursor:pointer}.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:40;display:flex;align-items:center;justify-content:center}.lb img{max-width:100%;max-height:100%}
:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
.seg{display:flex;gap:6px;margin-top:10px}.seg button{flex:1;border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;padding:10px;border-radius:10px}.seg .on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.sw{display:flex;gap:12px}.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}.sw .on{border-color:var(--card);box-shadow:0 0 0 3px var(--ink)}
.prog{display:flex;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.prog>div{flex:1;min-width:0}.badge{font-size:12px;color:var(--acc);font-weight:700}.nav button{font-size:11px}.rest{display:flex;gap:8px;align-items:center;margin-top:8px}.rest input{width:72px;text-align:center}
#sync{position:absolute;right:16px;top:14px;font-size:12px;color:var(--mute)}
.fin{margin-bottom:10px;border-style:solid;border-color:var(--acc)}.fin.on{background:var(--acc);color:var(--accink)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}.cal.wk span{text-align:center;font-size:11px;color:var(--mute)}
.cd{aspect-ratio:1;border:1px solid var(--line);background:var(--inp);color:var(--ink);border-radius:10px;font:inherit;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}.cd small{font-size:9px;line-height:1}
.cd.w{color:#fff;font-weight:700}
.leg{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:10px;font-size:12px}.leg span{display:flex;align-items:center;gap:5px}.leg i{width:10px;height:10px;border-radius:50%;display:inline-block}.cd.td{box-shadow:0 0 0 2px var(--ink)}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:21;display:grid;grid-template-columns:1fr 1fr;gap:8px;max-height:85vh;overflow:auto}
.sheet>.big,.sheet>.mute{grid-column:1/-1;margin:0}
.opt{border:1px solid var(--line);background:var(--inp);color:var(--ink);font:inherit;padding:13px;border-radius:12px}.opt.on{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}.opt.clr{color:#dc2626}
</style>
</head>
<body>
<header><div id="sync"></div><h1 id="ttl">🏋️ Lift Log</h1><div class="tabs" id="weeks"></div><div class="bar" id="bar"></div><div class="tabs" id="days"></div></header>

<script>

pull_b:[["barbell rows","8 to 12",3],["seated cable row","12 to 20",3,Y+"5Z27soGfOns"],["lat pulldown","12 to 15",3,Y+"SALxEARiMkw"],["shrugs","12 to 15",3],["strict curl","8 to 10",3,"","",1],["hammer curl","12 to 20",3],["conecntration curl","8 to 12",3,Y+"VMbDQ8PZazY"],["preacher curl","12 to 20",3]],

var KEY="liftlog.v1",S,uid=0,pend="";
var T=null,AC=null;
function fmtT(s){return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function beep(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=880;g.gain.value=.25;o.start();o.stop(AC.currentTime+.6)}catch(e){}}
function startRest(sec,name){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}T={end:Date.now()+sec*1000,total:sec,name:name,done:0,min:0,pz:0,pl:0,lit:-1};tick()}
function adjRest(v){if(!T)return;if(v===0){T=null}else{if(T.pz)T.pl=Math.max(0,T.pl+v*1000);else T.end+=v*1000;T.total=Math.max(1,T.total+v)}tick()}
function togglePause(){if(!T)return;if(T.pz){T.end=Date.now()+T.pl;T.pz=0}else{T.pl=Math.max(0,T.end-Date.now());T.pz=1}tick()}
function p2(n){return String(n).padStart(2,"0")}
function tick(){var f=document.getElementById("tfull"),p=document.getElementById("timer");if(!T){f.hidden=true;p.hidden=true;return}
 f.hidden=!!T.min;p.hidden=!T.min;
 var left=T.pz?Math.ceil(T.pl/1000):Math.max(0,Math.ceil((T.end-Date.now())/1000)),nm=T.name||"Rest",lit;
 document.getElementById("tlab").textContent=nm+" · rest";document.getElementById("pn").textContent=nm;
 if(left<=0&&!T.pz){if(!T.done){T.done=Date.now();beep();try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
  if(Date.now()-T.done>6000){T=null;f.hidden=true;p.hidden=true;return}
  document.getElementById("ttime").innerHTML="<i>Go!</i>";document.getElementById("pt").textContent="Go!";lit=90}
 else{T.done=0;document.getElementById("ttime").innerHTML=p2(Math.floor(left/3600))+":<i>"+p2(Math.floor(left%3600/60))+":"+p2(left%60)+"</i>";document.getElementById("pt").textContent=fmtT(left);lit=Math.ceil(90*Math.min(1,left/T.total))}
 if(T.lit!==lit){T.lit=lit;var L=document.getElementById("tsvg").children;for(var i=0;i<L.length;i++)L[i].setAttribute("class",i<lit?"tick on":"tick")}
 document.getElementById("tpp").textContent=T.pz?"▶":"❚❚"}
setInterval(tick,250);
(function(){var s="";for(var i=0;i<90;i++){var a=i/90*2*Math.PI,c=Math.cos(a),n=Math.sin(a);s+='<line class="tick on" x1="'+(100+n*93).toFixed(1)+'" y1="'+(100-c*93).toFixed(1)+'" x2="'+(100+n*83).toFixed(1)+'" y2="'+(100-c*83).toFixed(1)+'"/>'}document.getElementById("tsvg").innerHTML=s})();
function strip(){var c=JSON.parse(JSON.stringify(S));c.mem=(c.mem||[]).filter(function(m){return m.u.indexOf("data:")!==0});return c}
function resize(file){return new Promise(function(ok,no){var im=new Image(),u=URL.createObjectURL(file);im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no()},"image/jpeg",.8)};im.onerror=no;im.src=u})}
function b2d(b){return new Promise(function(ok){var r=new FileReader();r.onload=function(){ok(r.result)};r.readAsDataURL(b)})}
function addPhotos(fs){S.mem=S.mem||[];var list=Array.prototype.slice.call(fs),n=0;setSync("⏳ Adding photos…");
 return list.reduce(function(p,f){return p.then(function(){return resize(f).then(function(b){
  if(AS)return AS.upload(b).then(function(r){return{u:r.url,a:r.id}},function(){return b2d(b).then(function(d){return{u:d}})});
  return b2d(b).then(function(d){return{u:d}})}).then(function(r){S.mem.push({id:id(),d:iso(new Date()),u:r.u,a:r.a||""});n++}).catch(function(){})})},Promise.resolve()).then(function(){save();render();setSync(n+" photo"+(n===1?"":"s")+" added")})}
function memPage(){var L=(S.mem||[]).slice().sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:0}),last="",h='<label class="btn addp">+ Add photos<input type="file" id="mfile" accept="image/*" multiple hidden></label>';
 if(!L.length)h+='<div class="card mute">No memories yet. Add photos from your phone. Each one gets today\'s date, and you can change the date under the photo.</div>';
 h+='<div class="mg">';
 L.forEach(function(m){var mo=m.d.slice(0,7);if(mo!==last){last=mo;h+='<div class="mh">'+new Date(m.d+"T12:00:00").toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</div>'}
  h+='<div class="mc"><img src="'+esc(m.u)+'" data-lb="'+m.id+'" alt="Memory"><button class="x'+(pend===m.id?" sure":"")+'" data-act="mdel" data-id="'+m.id+'">'+(pend===m.id?"Tap again":"×")+'</button><input type="date" value="'+m.d+'" data-md="'+m.id+'"></div>'});
 var lb=(S.mem||[]).filter(function(m){return m.id===S.lb})[0];
 return h+'</div>'+(lb?'<div class="lb" data-lbx="1"><img src="'+esc(lb.u)+'"></div>':'')}
var COL={push_a:"#f97316",push_b:"#f97316",pull_a:"#06b6d4",pull_b:"#06b6d4",leg_a:"#ec4899",leg_b:"#ec4899",rest:"#64748b",busy:"#7c3aed",x:"#16a34a"};

 var t=ev.target;if(t.id==="wdate"){if(t.value){week().date=t.value;save();render()}return}
 if(t.dataset&&t.dataset.sd!==undefined){S.sched[t.dataset.sd]=t.value;save();render();return}
 if(t.id==="mfile"){addPhotos(t.files);t.value="";return}
 if(t.id==="backupfile"){importBackup(t.files&&t.files[0]);t.value="";return}
 if(t.dataset&&t.dataset.md){var mm=(S.mem||[]).filter(function(m){return m.id===t.dataset.md})[0];if(mm&&t.value){mm.d=t.value;save();render()}return}
 if(!t.dataset||!t.dataset.f)return;var e=find(t.dataset.id);if(!e)return;
 var v=t.value.trim();if(t.dataset.f==="l"&&v&&!/^https?:\/\//i.test(v)){v="https://"+v;t.value=v}
 e[t.dataset.f]=v;
 if(t.dataset.f==="l"){var a=t.parentNode.querySelector(".go");a.href=v;a.classList.toggle("show",!!v)}
 save();
});
document.addEventListener("click",function(ev){
 var b=ev.target.closest("[data-wk],[data-day],[data-act],[data-view],[data-open],[data-cd],[data-cm],[data-set],[data-lb],[data-lbx],[data-sm],[data-sc],[data-prog]");if(!b)return;var d=b.dataset;var was=pend;pend="";
 if(d.act==="exportbackup"){exportBackup();return}
 if(d.act==="importbackup"){var bf=document.getElementById("backupfile");if(bf)bf.click();return}
 if(d.view){S.view=d.view}
 else if(d.open){S.view="workout";S.day=d.open}
 else if(d.cd){S.pick=d.cd}
 else if(d.set!==undefined){if(d.set==="")delete S.done[S.pick];else if(d.set!=="close")S.done[S.pick]=d.set;S.pick=""}
 else if(d.cm){var cy=S.cy!==undefined?S.cy:new Date().getFullYear(),cm=(S.cm!==undefined?S.cm:new Date().getMonth())+ +d.cm,cn=new Date(cy,cm,1);S.cy=cn.getFullYear();S.cm=cn.getMonth()}
 else if(d.wk!==undefined){S.wk=+d.wk}
 else if(d.day){S.day=d.day}
 else if(d.act==="addweek"){
  var src=S.weeks[S.weeks.length-1],nd={};
  progDays(src).forEach(function(x){nd[x[0]]=src.days[x[0]].map(function(e){var c=JSON.parse(JSON.stringify(e));c.id=id();c.rr="";c.rs="";return c})});
  var nm=mon(src.date);nm.setDate(nm.getDate()+7);S.weeks.push({id:id(),prog:src.prog||"ppl",date:iso(nm),days:nd});S.wk=S.weeks.length-1;
 }
 else if(d.act==="sched"){S.showSched=!S.showSched}
 else if(d.act==="today"){var tm=iso(mon());S.weeks.forEach(function(w,i){if(iso(mon(w.date))===tm)S.wk=i});S.day=S.sched[WD[(new Date().getDay()+6)%7]]||S.day}
 else if(d.act==="rest"){var re=find(d.id);startRest(parseInt(re&&re.t)||90,re?re.n:"");return}
 else if(d.act==="tm"){adjRest(+d.v);return}
 else if(d.act==="tp"){togglePause();return}
 else if(d.act==="tmin"){if(T){T.min=1;tick()}return}
 else if(d.act==="tmax"){if(T){T.min=0;tick()}return}
 else if(d.act==="mdel"){if(was!==d.id){pend=d.id;render();return}var md=(S.mem||[]).filter(function(m){return m.id===d.id})[0];if(md&&md.a&&AS)AS.delete(md.a).catch(function(){});S.mem=(S.mem||[]).filter(function(m){return m.id!==d.id})}
 else if(d.lb){S.lb=d.lb}
 else if(d.lbx){S.lb=""}
 else if(d.sm){S.set.m=d.sm;applyTheme()}
 else if(d.sc){S.set.c=d.sc;applyTheme()}
 else if(d.prog){if(was!=="p"+d.prog){pend="p"+d.prog;render();return}useProg(d.prog);S.view="workout"}
 else if(d.act==="finish"){var td=iso(new Date());if(S.done[td])delete S.done[td];else S.done[td]=S.day}
 else if(d.act==="addex"){week().days[S.day].push(ex("New exercise","8 to 12",3))}
 else if(d.act==="rm"){if(was!==d.id){pend=d.id;render();return}var a=week().days[S.day];week().days[S.day]=a.filter(function(e){return e.id!==d.id})}
 else if(d.act==="delweek"){if(was!=="wk"){pend="wk";render();return}S.weeks.splice(S.wk,1);S.wk=Math.max(0,S.wk-1)}
 save();render();
 if(d.act==="addweek")document.querySelector("#weeks .on").scrollIntoView({inline:"center",block:"nearest"});
});
// make it installable (home-screen icon + manifest)
(function(){try{
 var c=document.createElement("canvas");c.width=c.height=512;var x=c.getContext("2d");
 x.fillStyle="#16a34a";x.fillRect(0,0,512,512);x.fillStyle="#fff";x.font="bold 300px sans-serif";x.textAlign="center";x.textBaseline="middle";x.fillText("L",256,280);
 var u=c.toDataURL("image/png");
 var a=document.createElement("link");a.rel="apple-touch-icon";a.href=u;document.head.appendChild(a);
 var m={name:"Lift Log",short_name:"Lift Log",display:"standalone",start_url:location.href,background_color:"#16a34a",theme_color:"#16a34a",icons:[{src:u,sizes:"512x512",type:"image/png"}]};
 var l=document.createElement("link");l.rel="manifest";l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.appendChild(l);
}catch(e){}})();
load();
(function(){var tm=iso(mon()),f=-1;S.weeks.forEach(function(w,i){if(iso(mon(w.date))===tm)f=i});if(f>=0)S.wk=f;var k=S.sched[WD[(new Date().getDay()+6)%7]];if(k)S.day=k;S.view="workout"})();
applyTheme();try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",applyTheme)}catch(e){}
render();
initSync();
</script>
